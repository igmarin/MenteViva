# No secrets here. Set them with `wrangler secret put` (see README.md).
name = "menteviva-jev-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

# Rate limit: 30 requests / 60s per client IP (Cloudflare ratelimit binding).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
