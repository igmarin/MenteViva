# Build and test MenteViva on a macOS runner.
#
# NOTE: the stock "Swift" template runs `swift build` / `swift test` — those are
# SwiftPM commands and this project has no Package.swift, so it fails every run.
# We use xcodebuild against the generated project instead.
#
# Cost warning: macOS runners bill at a much higher rate than Linux and this is a
# private repo, and the minutes ran out. The automatic triggers are therefore OFF:
# this runs only when started by hand from the Actions tab.
#
# `.githooks/pre-push` runs the same checks locally and is what actually guards
# `main` today. Install it once: git config core.hooksPath .githooks
# To turn CI back on when there are minutes again, restore:
#   pull_request:
#   push:
#     branches: [ "main" ]

name: Build and test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show toolchain
      run: xcodebuild -version

    - name: Regenerate project
      run: swift tools/generate_project.swift

    - name: Fail if the committed project drifted from the generator
      run: |
        git diff --exit-code -- MenteViva.xcodeproj || {
          echo "::error::MenteViva.xcodeproj is stale. Run 'swift tools/generate_project.swift' and commit."
          exit 1
        }

    - name: Lint (Apple swift-format, ships with Xcode)
      run: xcrun swift-format lint --strict --recursive MenteViva MenteVivaTests tools

    - name: Signposts match docs/profiling.md
      run: ./tools/check_signposts.sh

    - name: Pick an available iPhone simulator
      id: sim
      run: |
        SIM_UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
        if [ -z "$SIM_UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
        echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
        echo "Using simulator $SIM_UDID"

    - name: Build
      run: |
        xcodebuild build \
          -project MenteViva.xcodeproj \
          -scheme MenteViva \
          -destination "id=${{ steps.sim.outputs.udid }}"

    - name: Test
      run: |
        xcodebuild test \
          -project MenteViva.xcodeproj \
          -scheme MenteViva \
          -destination "id=${{ steps.sim.outputs.udid }}"
