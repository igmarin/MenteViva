# Build, lint and test MenteViva on macOS. macOS minutes bill at 10x Linux and
# ran out once (decisions.md 2026-10-20), so this runs only when a non-draft PR
# to main touches the app, tests, project or tools. A green run is ~2 minutes
# (~20 billed). Everything without Xcode runs in checks.yml on Linux.
# Local twin: .githooks/pre-push (AGENTS.md Workflow 5).
#
# NOTE: the stock "Swift" template runs `swift build` / `swift test` — SwiftPM
# commands, and this project has no Package.swift. We use xcodebuild instead.

name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "MenteViva/**"
      - "MenteVivaTests/**"
      - "MenteViva.xcodeproj/**"
      - "tools/**"
      - ".swift-format"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    # A hung simulator would otherwise bill up to 6 h at 10x.
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    # The image's default Xcode can lag the one we develop with, and
    # swift-format --strict differs between versions. Take the newest installed.
    - name: Select newest Xcode
      run: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
        xcodebuild -version

    - name: Regenerate project
      run: swift tools/generate_project.swift

    - name: Fail if the committed project drifted from the generator
      run: |
        git diff --exit-code -- MenteViva.xcodeproj || {
          echo "::error::MenteViva.xcodeproj is stale. Run 'swift tools/generate_project.swift' and commit."
          exit 1
        }

    - name: Lint (Apple swift-format, ships with Xcode)
      run: xcrun swift-format lint --strict --recursive MenteViva MenteVivaTests tools

    - name: Pick an available iPhone simulator
      id: sim
      run: |
        SIM_UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
        if [ -z "$SIM_UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
        echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
        echo "Using simulator $SIM_UDID"

    # `test` builds first, so no separate build step (it compiled twice).
    - name: Build and test
      run: |
        xcodebuild test \
          -project MenteViva.xcodeproj \
          -scheme MenteViva \
          -destination "id=${{ steps.sim.outputs.udid }}"
