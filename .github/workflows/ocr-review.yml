name: ocr PR Review

# One review per PR, not one per push: `synchronize` fires on every commit and
# the Actions minutes are out (AGENTS.md). Pre-commit hook + pre-push hook cover
# the rest. Runs alongside claude-code-review.yml and posts with the workflow's
# own token: the old GH_PAT bot had no access after the move to igmarin/menteviva,
# so every run reviewed fine and then failed with 404 while posting.
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  # The summary is an issue comment on the PR; the findings are review comments.
  issues: write
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The pinned CLI is older than npm latest, so `ocr config` starts a detached
      # npm self-update that removes the binary before `ocr review` runs: exit 127
      # (alibaba/open-code-review#703). Keep the pinned version for the whole job.
      OCR_NO_UPDATE: '1'
    steps:
      # The action does its own full-depth checkout of the PR, so no checkout here.
      - name: Run ocr review
        uses: alibaba/open-code-review@fabbdb296b0d97e2140ada8d54ca7d6d6d1d7ad4 # v1.12.13
        with:
          ocr_version: '1.12.13'
          llm_url: https://api.openai.com/v1/responses
          llm_auth_token: ${{ secrets.OPENAI_API_KEY }}
          llm_model: gpt-6-luna
          # Responses API: gpt-6-luna rejects function tools on /v1/chat/completions.
          llm_protocol: openai-responses
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          github_token: ${{ github.token }}
          effort: medium
          background: >-
            MenteViva is a SwiftUI iOS app (see AGENTS.md). Flag: crashes and
            force-unwraps, main-thread/actor misuse, a .swift file missing from
            MenteViva.xcodeproj/project.pbxproj (it is generated by
            tools/generate_project.swift, never hand-edited), os_signpost names
            that drift from the docs (tools/check_signposts.sh), and missing
            tests for new logic. Skip pure style nits: swift-format lint
            already runs in the pre-push hook.
