name: ocr PR Review

# One review per PR, not one per push: `synchronize` fires on every commit and
# the Actions minutes are out (AGENTS.md). Pre-commit hook + pre-push hook cover
# the rest. Runs alongside claude-code-review.yml; posts as the nebula-rs-guard
# bot via GH_PAT, like rs-guard's own review workflow.
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The action does its own full-depth checkout of the PR, so no checkout here.
      - name: Run ocr review
        uses: alibaba/open-code-review@182898cf522da3d04157b422752d028417974e19 # v1.12.12
        with:
          ocr_version: '1.12.12'
          llm_url: https://api.anthropic.com
          llm_auth_token: ${{ secrets.CLAUDE_API_KEY }}
          llm_model: claude-haiku-5-5
          llm_use_anthropic: 'true'
          github_token: ${{ secrets.GH_PAT || github.token }}
          effort: medium
          background: >-
            MenteViva is a SwiftUI iOS app (see AGENTS.md). Flag: crashes and
            force-unwraps, main-thread/actor misuse, a .swift file missing from
            MenteViva.xcodeproj/project.pbxproj (it is generated by
            tools/generate_project.swift, never hand-edited), os_signpost names
            that drift from the docs (tools/check_signposts.sh), and missing
            tests for new logic. Skip pure style nits: swift-format lint
            already runs in the pre-push hook.
