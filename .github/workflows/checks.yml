# Cheap checks on Linux (1x minutes) for every PR to main: no Xcode needed.
# The macOS build + test lives in swift.yml and only runs when Swift changes.
# Local twin: .githooks/pre-push (AGENTS.md Workflow 5).

name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: User-facing copy makes no prohibited claims
        run: ./tools/check_claims.sh

      - name: Signposts match docs/profiling.md
        run: ./tools/check_signposts.sh

      - name: Project file lists every .swift file
        run: ./tools/check_project_files.sh

      # The support address stays out of the repo; build_site.sh fills SUPPORT_EMAIL in at publish
      # time and refuses to build if a placeholder is left (#188). Building with a dummy address
      # here proves no new placeholder or TODO can reach a published page.
      - name: Site builds with every placeholder filled
        run: ./tools/build_site.sh ci-check@example.com && rm -rf site-out
